<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TNBC Knowledge Base</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (t === "dark" || (t === null && d)) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="wiki-first-frame-snapshot" hidden></div>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          var requestedScope = url.searchParams.get("scope");
          var scope =
            requestedScope === "public" || requestedScope === "session"
              ? requestedScope
              : localStorage.getItem("wiki-vite-scope") === "session"
                ? "session"
                : "public";
          if (scope !== "public") return;

          var currentReader = "__WIKI_CURRENT_READER_CACHE_VERSION__";
          var previousReader = "__WIKI_PREVIOUS_READER_CACHE_VERSION__";
          var snapshot = null;
          var snapshotReader = null;
          var candidates = [currentReader, previousReader];
          for (var index = 0; index < candidates.length; index += 1) {
            var reader = candidates[index];
            var key =
              "wiki-vite:first-frame:" +
              reader +
              ":" +
              window.location.origin;
            var serialized = localStorage.getItem(key);
            if (!serialized) continue;
            var candidate = JSON.parse(serialized);
            var validatedPrevious =
              reader !== previousReader ||
              (candidate.readerCacheVersion === previousReader &&
                typeof candidate.validatedAt === "number" &&
                candidate.validatedAt > 0);
            if (
              validatedPrevious &&
              candidate.pathname === window.location.pathname &&
              typeof candidate.html === "string" &&
              candidate.html.indexOf('data-test-id="document-article"') !== -1 &&
              candidate.html.indexOf('data-test-id="wiki-sidebar"') !== -1 &&
              candidate.html.indexOf("<h1") !== -1
            ) {
              snapshot = candidate;
              snapshotReader = reader;
              break;
            }
          }
          if (!snapshot) return;
          var host = document.getElementById("wiki-first-frame-snapshot");
          host.innerHTML = snapshot.html;
          host.hidden = false;
          host.dataset.readOnly = "true";
          host.dataset.readerCacheVersion = snapshotReader;
          var preventSnapshotAction = function (event) {
            event.preventDefault();
            event.stopPropagation();
          };
          host.addEventListener("click", preventSnapshotAction, true);
          host.addEventListener("submit", preventSnapshotAction, true);
          document.documentElement.dataset.wikiFirstFrame = "true";
          document.documentElement.dataset.wikiFirstFrameVersion =
            snapshotReader;
        } catch (error) {
          // localStorage may be disabled or contain a partially-written value.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
