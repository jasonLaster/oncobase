name: OncoGuide static checks
on:
  push:
    branches: [main]
    paths: ["apps/oncoguide/**", "apps/app/server/education-*", "packages/education/**", "packages/chat/**", "packages/wiki-markdown/**", "packages/wiki-content/**", "packages/wiki-shell/**", "packages/smart-table/**", "package.json", "bun.lock", "turbo.json", "eslint.config.mjs", "scripts/lint-ratchet.ts", ".github/workflows/oncoguide.yml"]
  pull_request:
    paths: ["apps/oncoguide/**", "apps/app/server/education-*", "packages/education/**", "packages/chat/**", "packages/wiki-markdown/**", "packages/wiki-content/**", "packages/wiki-shell/**", "packages/smart-table/**", "package.json", "bun.lock", "turbo.json", "eslint.config.mjs", "scripts/lint-ratchet.ts", ".github/workflows/oncoguide.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oncoguide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # OncoGuide and every workspace it depends on (the trailing "...").
      - run: bunx turbo run lint --filter=@oncobase/oncoguide... --continue
      - run: bunx turbo run test:unit --filter=@oncobase/oncoguide... --continue
      # The app's education routes serve OncoGuide's chat and Talk.
      - run: bun test apps/app/server/education-
      - run: bun --cwd apps/oncoguide build
      # After the build so Next's generated route types are checked too.
      - run: bunx turbo run typecheck --filter=@oncobase/oncoguide... --continue
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/oncoguide
      - run: bun --cwd apps/oncoguide test:e2e --reporter=line
      - run: bun --cwd apps/oncoguide test:e2e:chat --reporter=line
