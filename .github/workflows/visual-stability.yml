name: Visual Stability

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/app/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/visual-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            cpu: 1
          - browser: chromium
            cpu: 4
          - browser: firefox
            cpu: 1
          - browser: webkit
            cpu: 1
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/app
      - run: bun --cwd packages/diagnostics build && bun --cwd apps/app build
      - run: bun --cwd apps/app check:bundle
      - name: Check every loading transition on the production bundle
        working-directory: apps/app
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          VISUAL_CPU_RATE: ${{ matrix.cpu }}
        run: bunx playwright test --config playwright.stability.config.ts --reporter=list,json > visual-stability-run.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-stability-${{ matrix.browser }}-${{ matrix.cpu }}x
          path: |
            apps/app/visual-stability-run.log
            apps/app/.playwright/stability-results
          retention-days: 7
